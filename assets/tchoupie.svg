    <circle cx="98" cy="108" r="9"/>
    <circle cx="94" cy="132" r="8"/>
    <circle cx="202" cy="108" r="9"/>
    <circle cx="206" cy="132" r="8"/>
    <circle cx="110" cy="80" r="8"/>
    <circle cx="190" cy="80" r="8"/>
