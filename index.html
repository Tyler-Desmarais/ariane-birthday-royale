<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>Ariane — Battle Royale</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Teko:wght@500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<!-- ======================= SALON ======================= -->
<!-- l'image du salon est affichée telle quelle ; seul le bouton PLAY est
     interactif, positionné en pourcentage par-dessus l'image -->
<div id="lobby-ui">
  <div class="lobby-frame">
    <img src="assets/lobby.png" alt="Salon Fortnite — Ariane et Tchoupie" draggable="false">
    <button id="play-btn" class="play-hotspot" aria-label="PLAY"></button>
  </div>
</div>

<!-- ======================= VICTOIRE ROYALE ======================= -->
<div id="victory-screen">
  <div class="vic-emojis" aria-hidden="true">
    <span class="em e1">🦘</span><span class="em e2">🍦</span><span class="em e3">🏄‍♀️</span>
    <span class="em e4">🧪</span><span class="em e5">🍹</span><span class="em e6">📱</span>
    <span class="em e7">🦥</span><span class="em e8">✈️</span><span class="em e9">🥼</span>
    <span class="em e10">🍸</span>
  </div>
  <canvas id="confetti-canvas"></canvas>

  <div class="vic-inner">
    <img class="vic-banner" src="assets/victory-banner.png" alt="#1 Victoire Royale">
    <p class="vic-sub">JOYEUX ANNIVERSAIRE ARIANE !</p>
    <div class="vic-message" id="victory-message">
      <p>[ Message personnalisé à venir — remplace ce texte ]</p>
      <p>Lorem ipsum, ton petit mot d'anniversaire ira ici. 🎂</p>
    </div>

    <div class="photo-gallery">
      <img src="assets/Image-Swipe(1).jpg" alt="Souvenir 1" loading="lazy">
      <img src="assets/Image-Swipe(2).jpg" alt="Souvenir 2" loading="lazy">
      <img src="assets/Image-Swipe(3).jpg" alt="Souvenir 3" loading="lazy">
      <img src="assets/Image-Swipe(4).jpg" alt="Souvenir 4" loading="lazy">
      <img src="assets/Image-Swipe(5).jpg" alt="Souvenir 5" loading="lazy">
    </div>

    <button id="btn-rejouer" class="btn-rejouer">REJOUER</button>
  </div>
</div>

<!-- ======================= ROTATION ======================= -->
<div id="rotate-gate">
  <div class="rotate-inner">
    <div class="phone-icon">📱</div>
    <h2>TOURNE TON TÉLÉPHONE</h2>
    <p>Ce salon se joue en mode paysage.</p>
  </div>
</div>

<script src="script.js?v=3"></script>
</body>
</html>
